<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="540" fill="#ffffff"/>

  <!-- Regiones -->
  <rect x="20" y="40" width="410" height="420" rx="10" fill="#f4f4f4" stroke="#9a9a9a" stroke-dasharray="6 4"/>
  <text x="225" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#444">Red de instrumentación</text>
  <rect x="470" y="40" width="410" height="420" rx="10" fill="#eef4fb" stroke="#1f5fa8"/>
  <text x="675" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f5fa8">Red TSN</text>

  <!-- Enlaces de instrumentación (discontinuos) -->
  <g stroke="#6b6b6b" stroke-width="2" fill="none" stroke-dasharray="7 5">
    <line x1="200" y1="250" x2="260" y2="250"/>
    <polyline points="400,240 450,240 450,130 500,130"/>
    <polyline points="330,220 330,70 790,70 790,95"/>
    <polyline points="330,280 330,420 520,420"/>
  </g>

  <!-- Enlaces TSN (continuos) -->
  <g stroke="#1f5fa8" stroke-width="3.5" fill="none">
    <line x1="620" y1="130" x2="730" y2="130"/>
    <line x1="560" y1="165" x2="560" y2="334"/>
    <line x1="790" y1="165" x2="790" y2="334"/>
  </g>

  <!-- PC de instrumentación -->
  <rect x="40" y="210" width="160" height="80" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="120" y="245" text-anchor="middle" font-size="16" font-weight="bold">PC</text>
  <text x="120" y="267" text-anchor="middle" font-size="13" fill="#555">dell-i5</text>
  <text x="120" y="310" text-anchor="middle" font-size="12" fill="#555">SSH · Wireshark</text>

  <!-- Zyxel -->
  <rect x="260" y="220" width="140" height="60" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="246" text-anchor="middle" font-size="15" font-weight="bold">Zyxel</text>
  <text x="330" y="266" text-anchor="middle" font-size="12" fill="#555">switch de gestión</text>

  <!-- Switches TSN -->
  <rect x="500" y="95" width="120" height="70" rx="8" fill="#fff" stroke="#1f5fa8" stroke-width="2"/>
  <text x="560" y="125" text-anchor="middle" font-size="15" font-weight="bold">Switch 90</text>
  <text x="560" y="145" text-anchor="middle" font-size="12" fill="#555">RELY-TSN12</text>
  <rect x="730" y="95" width="120" height="70" rx="8" fill="#fff" stroke="#1f5fa8" stroke-width="2"/>
  <text x="790" y="125" text-anchor="middle" font-size="15" font-weight="bold">Switch 91</text>
  <text x="790" y="145" text-anchor="middle" font-size="12" fill="#555">RELY-TSN12</text>

  <rect x="582" y="84" width="54" height="22" rx="11" fill="#1f5fa8"/>
  <text x="609" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">GM</text>

  <!-- Nodo -->
  <rect x="520" y="340" width="340" height="110" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <rect x="550" y="334" width="20" height="12" fill="#1f5fa8"/>
  <rect x="780" y="334" width="20" height="12" fill="#1f5fa8"/>
  <text x="566" y="250" font-size="13" fill="#1f5fa8" font-family="Courier New, monospace">enp4s0f3</text>
  <text x="784" y="250" font-size="13" fill="#1f5fa8" font-family="Courier New, monospace" text-anchor="end">enp3s0f3</text>
  <text x="560" y="372" text-anchor="middle" font-size="12">ptp4l</text>
  <text x="560" y="389" text-anchor="middle" font-size="11" fill="#555" font-family="Courier New, monospace">gPTP4.cfg</text>
  <text x="790" y="372" text-anchor="middle" font-size="12">ptp4l</text>
  <text x="790" y="389" text-anchor="middle" font-size="11" fill="#555" font-family="Courier New, monospace">gPTP3.cfg</text>
  <text x="675" y="432" text-anchor="middle" font-size="15" font-weight="bold">nodo16p</text>
  <text x="525" y="414" font-size="11" fill="#6b6b6b">gestión</text>

  <!-- Leyenda -->
  <g font-size="13" fill="#333">
    <line x1="40" y1="500" x2="90" y2="500" stroke="#1f5fa8" stroke-width="3.5"/>
    <text x="100" y="505">Enlace TSN (tráfico gPTP)</text>
    <line x1="320" y1="500" x2="370" y2="500" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="380" y="505">Enlace de instrumentación (SSH, capturas, gestión)</text>
  </g>
</svg>
